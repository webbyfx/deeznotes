<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DeezNotes — A modern, beautiful note-taking web app.">
    <title>{% block title %}DeezNotes{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.4">
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <div style="position: fixed; bottom: 8px; right: 12px; font-size: 0.75rem; color: var(--text-muted); z-index: 9999; pointer-events: none; opacity: 0.7;">
        v{{ app_version }}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
